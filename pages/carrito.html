<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
</head>
<body>
    <div class="container-encabezado">
        <div class="container-nombre">
            <a href="../index.html"><img src="../img/Macetitas&Co nuevo.png" alt="macetitas y co" title="Volver a inicio"></a>
        </div>
        <div class="container-menu">
            <a href="https://www.instagram.com/macetitas_y_co/"><div class="enlaces">Seguinos en Instagram!</div></a>
            <a href="categoriasmenu.html"><div class="enlaces">Categorias</div></a>
            <a href="nosotros.html"><div class="enlaces">Nosotros</div></a>
            <a href="contacto.html"><div class="enlaces">Contacto</div></a>
        </div>
        <div class="container-logo">
            <img src="../img/macetitas.png" alt="una maceta sonriente rodeada por el nombre del emprendimiento">
        </div>
    </div>
    <h1 style="text-align:center; padding-top: 150px;">Carrito</h1>

    <div id="listaCarrito" class="container-productos"></div>

    <h2 style="text-align: center;">Total: $<span id="total"></span></h2>

    <script type="module">
        import { obtenerCarrito, eliminarDelCarrito, actualizarContadorCarrito } from "../js/carrito.js";

        function mostrarCarrito() {
            const carrito = obtenerCarrito();
            const contenedor = document.getElementById("listaCarrito");
            const totalSpan = document.getElementById("total");

            contenedor.innerHTML = "";

            let total = 0;

            carrito.forEach(p => {
                total += p.precio * p.cantidad;

                contenedor.innerHTML += `
                    <div class="producto">
                        <img src="${p.imagen}">
                        <p>${p.nombre}</p>
                        <p>$${p.precio}</p>
                        <p>Cantidad: ${p.cantidad}</p>
                        <button class="btn-eliminar" data-id="${p.id}">Eliminar</button>
                    </div>
                `;
            });

            totalSpan.textContent = total;

            // botones eliminar
            document.querySelectorAll(".btn-eliminar").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    eliminarDelCarrito(e.target.dataset.id);
                    mostrarCarrito();
                });
            });
        }

        actualizarContadorCarrito();
        mostrarCarrito();
    </script>
    <div class="personajes-izq">
        <img src="/img/personajes.png">
    </div>
    <div class="personajes-der">
        <img src="/img/personajes.png">
    </div>
</body>
</html>
